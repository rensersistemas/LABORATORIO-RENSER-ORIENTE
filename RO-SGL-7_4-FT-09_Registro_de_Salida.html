<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RO-SGL-7.4-FT-09 | Registro de Salida de Items</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- ExcelJS CDN: escribe sobre la plantilla conservando estilos y fórmulas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
    <!-- jsPDF: dibuja el PDF directamente desde la hoja de Excel generada -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9;
        }
        .cond-select {
            font-size: 0.75rem;
            padding: 0.25rem 0.15rem;
            border-radius: 0.25rem;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
        }
        .cond-OK { background-color: #dcfce7; color: #15803d; border: 1px solid #86efac; }
        .cond-NC { background-color: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; }
        .cond-RG { background-color: #fef3c7; color: #b45309; border: 1px solid #fde047; }
        .cond-NT { background-color: #f3f4f6; color: #4b5563; border: 1px solid #d1d5db; }
        .cond-NA { background-color: #e5e7eb; color: #6b7280; border: 1px solid #9ca3af; }

        /* ---------- Responsive: tabla de ítems ----------
           La tabla tiene 19 columnas; en celular no se puede mostrar entera
           sin desplazamiento horizontal. Se fija un ancho mínimo y se deja
           que el contenedor haga scroll-x, con la columna "Ítem" y el
           encabezado fijos para no perder la referencia al desplazarse. */
        .tabla-scroll {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border: 1px solid #cbd5e1;
            border-radius: 0.5rem;
        }
        .tabla-scroll table { min-width: 1150px; border: none; }
        .tabla-scroll thead th {
            position: sticky;
            top: 0;
            z-index: 2;
        }
        /* Un elemento "sticky" debe traer su propio color de fondo: el que
           pinta la fila (tr) no siempre se conserva al fijarlo. */
        .tabla-scroll thead tr:nth-child(1) th { background-color: #1e293b; }
        .tabla-scroll thead tr:nth-child(2) th { background-color: #334155; }
        .tabla-scroll th:first-child,
        .tabla-scroll td:first-child {
            position: sticky;
            left: 0;
            z-index: 1;
        }
        .tabla-scroll thead th:first-child { z-index: 3; }
        .tabla-scroll td:first-child { background-color: #f1f5f9; }

        @media print {
            .tabla-scroll { overflow: visible; border: none; }
            .tabla-scroll table { min-width: 0; }
            .tabla-scroll th:first-child,
            .tabla-scroll td:first-child,
            .tabla-scroll thead th { position: static; }
        }

        @media (max-width: 640px) {
            input[type="text"], input[type="date"], input[type="time"],
            textarea, select:not(.cond-select) {
                font-size: 16px; /* evita el zoom automático de Safari/iOS al enfocar */
            }
        }

        @media print {
            @page {
                size: landscape;
                margin: 5mm;
            }
            body {
                background-color: #fff;
                color: #000;
                font-size: 9pt;
            }
            .no-print {
                display: none !important;
            }
            .print-table {
                width: 100% !important;
                border-collapse: collapse !important;
            }
            .print-table th, .print-table td {
                border: 1px solid #000 !important;
                padding: 2px 4px !important;
                font-size: 8pt !important;
            }
        }
    </style>
</head>
<body class="p-3 md:p-6 text-slate-800">
<div class="max-w-[1200px] mx-auto bg-white rounded-xl shadow-lg border border-slate-200 overflow-hidden">

  <div class="no-print bg-slate-900 text-white p-4 flex flex-wrap justify-between items-center gap-3 border-b border-slate-800">
    <div class="flex items-center gap-3">
      <div class="bg-amber-500 text-slate-950 p-2.5 rounded-lg font-bold"><i class="fa-solid fa-truck-ramp-box text-xl"></i></div>
      <div>
        <h1 class="font-bold text-lg leading-tight">Sistema de Gestión de Laboratorio (SGL)</h1>
        <p class="text-xs text-slate-400">Registro de Salida de Items | <span class="text-amber-400 font-mono">RO-SGL-7.4-FT-09</span></p>
      </div>
    </div>
    <div class="flex flex-wrap items-center gap-2">
      <button onclick="nuevoFormulario()" class="bg-slate-700 hover:bg-slate-600 text-xs text-white px-3 py-2 rounded-lg transition flex items-center gap-1.5 font-medium"><i class="fa-solid fa-file-circle-plus"></i> Nuevo</button>
      <button onclick="abrirBuscadorSalidas()" title="Buscar una salida guardada" class="bg-slate-700 hover:bg-slate-600 text-xs text-sky-300 px-3 py-2 rounded-lg transition flex items-center gap-1.5 font-medium"><i class="fa-solid fa-magnifying-glass"></i> Buscar Salida</button>
      <button onclick="seleccionarPlantilla()" title="La plantilla oficial ya viene incluida" class="bg-slate-700 hover:bg-slate-600 text-xs text-white px-3 py-2 rounded-lg transition flex items-center gap-1.5 font-medium"><i class="fa-solid fa-table-list text-emerald-400"></i> Cambiar Plantilla</button>
      <input type="file" id="inputPlantilla" accept=".xlsx" class="hidden">
      <button onclick="guardarSalida()" id="btnGuardar" title="Registra la salida en la base de datos y avanza el correlativo" class="bg-amber-500 hover:bg-amber-400 text-xs text-slate-950 px-3.5 py-2 rounded-lg transition flex items-center gap-1.5 font-semibold shadow"><i class="fa-solid fa-floppy-disk"></i> Guardar</button>
      <button onclick="exportarExcel()" class="bg-emerald-600 hover:bg-emerald-500 text-xs text-white px-3.5 py-2 rounded-lg transition flex items-center gap-1.5 font-semibold shadow"><i class="fa-solid fa-file-excel"></i> Exportar Excel</button>
      <button onclick="exportarPDF()" class="bg-blue-600 hover:bg-blue-500 text-xs text-white px-3.5 py-2 rounded-lg transition flex items-center gap-1.5 font-semibold shadow"><i class="fa-solid fa-file-pdf"></i> Exportar PDF</button>
      <button onclick="imprimirPDF()" class="bg-slate-600 hover:bg-slate-500 text-xs text-white px-3.5 py-2 rounded-lg transition flex items-center gap-1.5 font-semibold shadow"><i class="fa-solid fa-print"></i> Imprimir</button>
    </div>
  </div>

  <!-- Importar desde recepción -->
  <div class="no-print p-4 bg-amber-50 border-b border-amber-200">
    <div class="flex flex-wrap items-center gap-3">
      <div class="font-bold text-sm text-amber-900"><i class="fa-solid fa-wand-magic-sparkles mr-1"></i> Llenar desde una recepción</div>
      <button onclick="abrirBuscador()" title="Buscar una recepción guardada por su número" class="bg-slate-800 hover:bg-slate-700 text-white text-xs px-3 py-2 rounded-lg font-semibold flex items-center gap-1.5"><i class="fa-solid fa-magnifying-glass text-sky-400"></i> Buscar recepción</button>
      <button onclick="document.getElementById('inputRecepciones').click()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs px-3 py-2 rounded-lg font-semibold flex items-center gap-1.5"><i class="fa-solid fa-file-import"></i> Cargar Excel(s) de recepción</button>
      <button onclick="importarBorrador()" class="bg-white hover:bg-amber-100 border border-amber-300 text-amber-900 text-xs px-3 py-2 rounded-lg font-semibold flex items-center gap-1.5"><i class="fa-solid fa-floppy-disk"></i> Desde borrador de recepción</button>
      <input type="file" id="inputRecepciones" accept=".xlsx" multiple class="hidden">
      <label class="inline-flex items-center gap-1.5 text-xs text-amber-900 font-medium cursor-pointer"><input type="checkbox" id="agrupar" checked> Agrupar equipos iguales (marca + modelo)</label>
    </div>
    <p id="msgImport" class="text-xs text-amber-800 mt-2"></p>
  </div>

  <!-- Cabecera -->
  <div class="p-4 bg-white border-b border-slate-200">
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 text-xs">
      <div><label class="block font-bold text-slate-700 mb-1">Registro de Salida Nro.:</label>
        <input type="text" id="nroSalida" class="w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none font-mono font-semibold text-slate-900"></div>
      <div><label class="block font-bold text-slate-700 mb-1">Fecha:</label>
        <input type="date" id="fecha" class="w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none font-semibold"></div>
      <div class="md:col-span-2"><label class="block font-bold text-slate-700 mb-1">No. Recepción:</label>
        <input type="text" id="nroRecepcion" placeholder="ej. LB-2026-1401 (varias: sepárelas con  / )" class="w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none font-mono font-semibold"></div>
      <div class="md:col-span-2"><label class="block font-bold text-slate-700 mb-1">Cliente / Destino:</label>
        <input type="text" id="cliente" placeholder="Nombre de la empresa o destino" class="w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none font-semibold"></div>
      <div class="md:col-span-2"><label class="block font-bold text-slate-700 mb-1">Responsable:</label>
        <input type="text" id="responsable" placeholder="Si se deja vacío, se usa el Cliente / Destino" class="w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none"></div>
    </div>
  </div>

  <!-- Ítems -->
  <div class="p-4">
    <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-2 mb-3">
      <h2 class="font-bold text-slate-800 text-sm"><i class="fa-solid fa-list-check text-amber-500 mr-1"></i> Ítems que salen <span id="contador" class="ml-1 text-xs font-medium text-slate-500"></span></h2>
      <button onclick="agregarFila()" class="bg-slate-800 hover:bg-slate-700 text-white text-xs px-3 py-2 rounded-lg font-semibold flex items-center gap-1.5 self-start"><i class="fa-solid fa-plus"></i> Agregar fila</button>
    </div>
    <div id="listaItems" class="space-y-2"></div>
  </div>

  <div class="px-4 pb-4">
    <label class="block font-bold text-slate-700 mb-1 text-xs">Observaciones:</label>
    <textarea id="observaciones" rows="2" class="w-full p-2 border border-slate-300 rounded text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
  </div>

  <div class="p-4 bg-slate-50 border-t border-slate-200 grid grid-cols-1 md:grid-cols-3 gap-4 text-xs">
    <div><label class="block font-bold text-slate-700 mb-1">Elaborado por</label><input type="text" id="elaborado" class="w-full p-2 border border-slate-300 rounded"></div>
    <div><label class="block font-bold text-slate-700 mb-1">Aprobado por</label><input type="text" id="aprobado" class="w-full p-2 border border-slate-300 rounded"></div>
    <div><label class="block font-bold text-slate-700 mb-1">Recibido por</label><input type="text" id="recibido" placeholder="Vacío = Responsable" class="w-full p-2 border border-slate-300 rounded"></div>
  </div>
</div>

<!-- MODAL DE BÚSQUEDA (Firebase) — mismo formato que RO-SGL-7.4-FT-01 -->
<div id="modalBuscar" class="no-print hidden fixed inset-0 z-50 bg-slate-900/60 flex items-start justify-center p-3 pt-16" onclick="if(event.target===this)cerrarBuscador()">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-2xl border border-slate-200">
        <div class="flex items-center justify-between p-3 border-b border-slate-200">
            <h3 class="font-bold text-sm text-slate-800 flex items-center gap-2"><i class="fa-solid fa-magnifying-glass text-sky-600"></i> Buscar recepción guardada</h3>
            <button onclick="cerrarBuscador()" class="text-slate-400 hover:text-slate-700 px-2"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <form class="p-3 flex gap-2" onsubmit="event.preventDefault(); ejecutarBusqueda();">
            <input type="text" id="buscarNro" placeholder="Nro. de recepción, cliente, equipo o serial. Vacío = las más recientes (busca en las últimas 1000)" class="flex-1 p-2 border border-slate-300 rounded text-xs font-mono focus:ring-2 focus:ring-blue-500 focus:outline-none" style="font-size:16px">
            <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold px-4 rounded">Buscar</button>
        </form>
        <div id="resultadosBusqueda" class="px-3 pb-3 max-h-[60vh] overflow-y-auto text-xs"></div>
    </div>
</div>
<!-- MODAL: buscar salidas guardadas -->
<div id="modalSalidas" class="no-print hidden fixed inset-0 z-50 bg-slate-900/60 flex items-start justify-center p-3 pt-16" onclick="if(event.target===this)cerrarBuscadorSalidas()">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-2xl border border-slate-200">
        <div class="flex items-center justify-between p-3 border-b border-slate-200">
            <h3 class="font-bold text-sm text-slate-800 flex items-center gap-2"><i class="fa-solid fa-magnifying-glass text-sky-600"></i> Buscar salida guardada</h3>
            <button onclick="cerrarBuscadorSalidas()" class="text-slate-400 hover:text-slate-700 px-2"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <form class="p-3 flex gap-2" onsubmit="event.preventDefault(); ejecutarBusquedaSalidas();">
            <input type="text" id="buscarSalida" placeholder="Nro. de salida, cliente, recepción, equipo o serial. Vacío = las más recientes" class="flex-1 p-2 border border-slate-300 rounded text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none" style="font-size:16px">
            <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold px-4 rounded">Buscar</button>
        </form>
        <p class="px-3 pb-2 text-[11px] text-slate-400">Busca entre las últimas 1000 salidas guardadas.</p>
        <div id="resultadosSalidas" class="px-3 pb-3 max-h-[60vh] overflow-y-auto text-xs"></div>
    </div>
</div>
<div id="toast" class="no-print hidden fixed bottom-4 left-1/2 -translate-x-1/2 z-[60] px-4 py-2 rounded-lg shadow-lg text-xs font-semibold text-white max-w-[90vw]"></div>

<script>
        const NOMBRE_HOJA = 'Registro de Salida';
        const ANCHO_POR_DEFECTO = 9;
        const CLAVE_BORRADOR = 'RO_SGL_7_4_FT_09_borrador';
        const CLAVE_CORRELATIVO = 'RO_SGL_7_4_FT_09_correlativo';
        const CLAVE_RECEPCION = 'RO_SGL_7_4_FT_01_borrador';
        const ULTIMO_CONOCIDO = 539;           // último Nro. de Salida visto en la plantilla (00539)
        /* Filas de ítems: la plantilla trae 13 (filas 20-32). Cada página se arma con las filas que
           necesita: mínimo FILAS_MIN, máximo FILA_MAX; si hay más ítems se crea otra página.
           PRESUPUESTO_ALTO (pt) evita páginas absurdamente altas cuando las filas llevan muchos seriales.
           Para volver al aspecto anterior (siempre 13 filas con casillas vacías) use FILAS_MIN = 13. */
        const FILA_INI = 20, FILAS_PLANTILLA = 13, FILAS_MIN = 1, FILA_MAX = 14, PRESUPUESTO_ALTO = 600;
        const CAMPOS = ['nroSalida','fecha','nroRecepcion','cliente','responsable','observaciones','elaborado','aprobado','recibido'];
        let plantillaBuffer = null;
        let items = [];

        /* ---------- Correlativo ---------- */
        function ultimoUsado() { try { return JSON.parse(localStorage.getItem(CLAVE_CORRELATIVO)).ultimo; } catch { return ULTIMO_CONOCIDO; } }
        function proponerCorrelativo() { return String(ultimoUsado() + 1).padStart(5, '0'); }
        const numSalida = () => parseInt(val('nroSalida').replace(/\D/g, ''), 10) || 0;
        const fmtSalida = n => String(n).padStart(5, '0');
        function guardarUltimo(n) { try { localStorage.setItem(CLAVE_CORRELATIVO, JSON.stringify({ ultimo: n })); } catch {} }
        function confirmarCorrelativo() {
            const n = numSalida();
            if (n && n > ultimoUsado()) guardarUltimo(n);
        }

        /* ---------- Correlativo compartido (Firebase: /salidas/<00541>) ----------
           El número emitido se registra en la base de datos al exportar. Así el siguiente
           número no depende del navegador/equipo: se toma el mayor entre el local y el remoto. */
        const FB_URL = 'https://laboratorio-64b0f-default-rtdb.firebaseio.com';
        const FB_SALIDAS = 'salidas';
        async function fbSalidas(ruta, opc = {}) {
            const r = await fetch(`${FB_URL}/${FB_SALIDAS}${ruta}.json`, opc);
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.json();
        }
        /** Trae el mayor número emitido en Firebase y lo adopta si supera al local. Devuelve el último conocido. */
        async function sincronizarCorrelativoRemoto() {
            try {
                const q = '?orderBy=' + encodeURIComponent('"$key"') + '&limitToLast=1';
                const r = await fetch(`${FB_URL}/${FB_SALIDAS}.json${q}`);
                if (!r.ok) throw new Error('HTTP ' + r.status);
                const datos = await r.json();
                const n = parseInt(Object.keys(datos || {})[0], 10);
                if (Number.isFinite(n) && n > ultimoUsado()) guardarUltimo(n);
            } catch { /* sin conexión o sin permisos: se sigue con el correlativo local */ }
            return ultimoUsado();
        }
        /** Antes de exportar: si el número ya lo emitió otra salida distinta, se ofrece el siguiente libre. */
        async function asegurarNumeroLibre() {
            let n = numSalida();
            if (!n) return true;
            try {
                const ultimo = await sincronizarCorrelativoRemoto();
                const previa = await fbSalidas('/' + fmtSalida(n));
                const mismaSalida = previa && String(previa.nroRecepcion || '') === val('nroRecepcion') && String(previa.cliente || '') === val('cliente');
                if (previa && !mismaSalida) {
                    const sig = fmtSalida(Math.max(ultimo, n) + 1);
                    if (!confirm(`El Nro. de salida ${fmtSalida(n)} ya fue emitido` + (previa.cliente ? ` (${previa.cliente})` : '') + `.\n¿Usar el siguiente número disponible (${sig})?`)) return false;
                    document.getElementById('nroSalida').value = sig; guardarAuto();
                }
            } catch { /* sin conexión: se continúa con el número actual */ }
            return true;
        }
        /* ---------- Buscar salidas guardadas ---------- */
        const sinTildes = t => String(t ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
        const LIMITE_BUSQUEDA = 1000;   // cuántas de las últimas salidas / recepciones se revisan al buscar
        let salidasCache = {};
        function abrirBuscadorSalidas() {
            document.getElementById('modalSalidas').classList.remove('hidden');
            const inp = document.getElementById('buscarSalida'); inp.value = ''; inp.focus();
            ejecutarBusquedaSalidas();
        }
        function cerrarBuscadorSalidas() { document.getElementById('modalSalidas').classList.add('hidden'); }

        async function ejecutarBusquedaSalidas() {
            const cont = document.getElementById('resultadosSalidas');
            const q = sinTildes(document.getElementById('buscarSalida').value.trim());
            cont.innerHTML = '<p class="text-slate-500 p-2"><i class="fa-solid fa-spinner fa-spin"></i> Buscando…</p>';
            try {
                // Se traen las últimas 1000 salidas y se filtra aquí: permite buscar por cualquier dato, no solo por número.
                const r = await fetch(`${FB_URL}/${FB_SALIDAS}.json?orderBy=${encodeURIComponent('"$key"')}&limitToLast=${LIMITE_BUSQUEDA}`);
                if (!r.ok) throw new Error(r.status === 401 || r.status === 403 ? 'Firebase rechazó el acceso. Revise las reglas de la base de datos.' : 'Error HTTP ' + r.status);
                salidasCache = (await r.json()) || {};
                const claves = Object.keys(salidasCache).sort().reverse().filter(k => {
                    if (!q) return true;
                    const d = salidasCache[k] || {};
                    const lista = Array.isArray(d.items) ? d.items : Object.values(d.items || {});
                    const texto = sinTildes([k, d.nroSalida, d.cliente, d.nroRecepcion, d.responsable, d.observaciones,
                        ...lista.map(i => [i.equipo, i.marca, i.modelo, i.serial, i.obs].join(' '))].join(' '));
                    return texto.includes(q) || (/^\d+$/.test(q) && k.replace(/^0+/, '').startsWith(q.replace(/^0+/, '')));
                });
                cont.innerHTML = '';
                if (!claves.length) { cont.innerHTML = '<p class="text-slate-500 p-2">No se encontraron salidas.</p>'; return; }
                claves.slice(0, 30).forEach(k => {
                    const d = salidasCache[k] || {};
                    const lista = Array.isArray(d.items) ? d.items : Object.values(d.items || {});
                    const equipos = lista.reduce((t, i) => t + (parseInt(i.cant) || 0), 0);
                    const b = document.createElement('button');
                    b.type = 'button';
                    b.className = 'w-full text-left p-2 mb-1 border border-slate-200 rounded hover:bg-blue-50 hover:border-blue-300 transition';
                    const l1 = document.createElement('div'); l1.className = 'font-mono font-bold text-slate-800'; l1.textContent = 'Salida ' + (d.nroSalida || k);
                    const l2 = document.createElement('div'); l2.className = 'text-slate-500';
                    l2.textContent = [d.cliente || 'Sin cliente', d.nroRecepcion, d.fecha ? fechaTexto(d.fecha) : '', equipos ? equipos + ' equipo(s)' : ''].filter(Boolean).join('  ·  ');
                    b.append(l1, l2);
                    b.addEventListener('click', () => cargarSalida(k));
                    cont.appendChild(b);
                });
                if (claves.length > 30) { const p = document.createElement('p'); p.className = 'text-slate-400 p-2'; p.textContent = `Se muestran 30 de ${claves.length}. Afine la búsqueda para ver otras.`; cont.appendChild(p); }
            } catch (e) {
                cont.innerHTML = ''; const p = document.createElement('p'); p.className = 'text-red-600 p-2'; p.textContent = 'Error en la búsqueda: ' + e.message; cont.appendChild(p);
            }
        }

        function cargarSalida(k) {
            const d = salidasCache[k];
            if (!d) return avisar('No se pudo cargar la salida.', 'error');
            const lista = Array.isArray(d.items) ? d.items : Object.values(d.items || {});
            aplicar({ ...d, items: lista.map(i => ({ ...filaVacia(), ...i })) });   // Firebase descarta vacíos: se completan los campos
            guardarAuto();
            cerrarBuscadorSalidas();
            avisar(`Salida ${d.nroSalida || k} cargada.`);
        }

        /** Registra la salida en Firebase. Lanza error si no se pudo. */
        async function registrarSalidaRemota() {
            const n = numSalida();
            await fbSalidas('/' + fmtSalida(n), { method: 'PUT', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ...estado(), formulario: 'RO-SGL-7.4-FT-09', guardadoEn: new Date().toISOString() }) });
        }

        /** Botón Guardar: es lo único que registra la salida y hace avanzar el correlativo. Exportar no lo hace. */
        async function guardarSalida() {
            if (!numSalida()) return avisar('Escriba el Nro. de salida antes de guardar.', 'error');
            if (!items.some(r => r.equipo || r.marca || r.modelo || r.serial)) return avisar('Agregue al menos un equipo antes de guardar.', 'error');
            const btn = document.getElementById('btnGuardar'), html = btn.innerHTML;
            btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Guardando…';
            try {
                if (!(await asegurarNumeroLibre())) return;
                const n = numSalida();
                let remoto = true;
                try { await registrarSalidaRemota(); } catch (err) { remoto = false; }
                confirmarCorrelativo();                      // el siguiente "Nuevo" propone n + 1
                guardarAuto();
                if (remoto) avisar(`Salida ${fmtSalida(n)} guardada. La próxima será la ${fmtSalida(n + 1)}.`);
                else avisar(`Salida ${fmtSalida(n)} guardada solo en este equipo: no se pudo conectar con la base de datos.`, 'error');
            } finally { btn.disabled = false; btn.innerHTML = html; }
        }
        const hoyISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };

        /* ---------- Estado / borrador ---------- */
        function estado() { const e = { items }; CAMPOS.forEach(c => e[c] = document.getElementById(c).value); return e; }
        let tGuardar;
        function guardarAuto() { clearTimeout(tGuardar); tGuardar = setTimeout(() => { try { localStorage.setItem(CLAVE_BORRADOR, JSON.stringify(estado())); } catch {} }, 400); }
        function aplicar(e) { if (typeof cargadas !== 'undefined') cargadas.clear(); CAMPOS.forEach(c => document.getElementById(c).value = e[c] ?? ''); items = e.items?.length ? e.items : [filaVacia()]; renderItems(); }
        const filaVacia = () => ({ cant: '', equipo: '', marca: '', modelo: '', serial: '', obs: '' });

        window.addEventListener('DOMContentLoaded', () => {
            let e = null;
            try { e = JSON.parse(localStorage.getItem(CLAVE_BORRADOR)); } catch {}
            if (e) aplicar(e); else nuevoFormulario(true);
            // Otro equipo pudo emitir números nuevos: si el borrador quedó con un número ya emitido, se avanza al siguiente.
            const previo = ultimoUsado();
            sincronizarCorrelativoRemoto().then(ult => {
                const n = numSalida();
                if (ult > previo && n && n <= ult) { document.getElementById('nroSalida').value = fmtSalida(ult + 1); guardarAuto(); }
            });
            document.addEventListener('input', guardarAuto);
            document.getElementById('inputRecepciones').addEventListener('change', async ev => {
                const files = [...ev.target.files]; ev.target.value = '';
                if (files.length) await importarExcel(files);
            });
        });

        async function nuevoFormulario(silencioso) {
            if (silencioso !== true && !confirm('¿Desea limpiar el formulario actual?')) return;
            await sincronizarCorrelativoRemoto();          // toma el último número emitido en cualquier equipo
            aplicar({ nroSalida: proponerCorrelativo(), fecha: hoyISO(), elaborado: 'Elian Martínez', aprobado: 'Zoraida Zapata', items: [filaVacia()] });
            guardarAuto();
        }

        /* ---------- Ítems (tarjetas responsivas) ---------- */
        const escapeHtml = t => String(t ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
        function renderItems() {
            const cls = 'w-full p-2 border border-slate-300 rounded text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white';
            const lab = t => `<span class="block text-[10px] font-bold uppercase tracking-wide text-slate-500 mb-0.5">${t}</span>`;
            document.getElementById('listaItems').innerHTML = items.map((r, i) => `
              <div class="grid grid-cols-2 md:grid-cols-12 gap-2 items-start bg-slate-50 border border-slate-200 rounded-lg p-3">
                <div class="md:col-span-1">${lab('Cant.')}<input type="number" min="0" value="${escapeHtml(r.cant)}" oninput="items[${i}].cant=this.value" class="${cls} text-center font-semibold"></div>
                <div class="md:col-span-2">${lab('Equipo')}<input type="text" value="${escapeHtml(r.equipo)}" oninput="items[${i}].equipo=this.value" class="${cls}"></div>
                <div class="md:col-span-2">${lab('Marca')}<input type="text" value="${escapeHtml(r.marca)}" oninput="items[${i}].marca=this.value" class="${cls}"></div>
                <div class="md:col-span-2">${lab('Modelo')}<input type="text" value="${escapeHtml(r.modelo)}" oninput="items[${i}].modelo=this.value" class="${cls}"></div>
                <div class="col-span-2 md:col-span-2">${lab('Serial (uno por línea)')}<textarea rows="2" oninput="items[${i}].serial=this.value" class="${cls} font-mono">${escapeHtml(r.serial)}</textarea></div>
                <div class="col-span-2 md:col-span-2">${lab('Observaciones (una por línea)')}<textarea rows="2" oninput="items[${i}].obs=this.value" class="${cls} font-mono">${escapeHtml(r.obs)}</textarea></div>
                <div class="col-span-2 md:col-span-1 flex md:justify-end md:pt-4"><button onclick="eliminarFila(${i})" title="Eliminar fila" class="text-red-600 hover:bg-red-50 border border-red-200 rounded px-3 py-2 text-xs w-full md:w-auto"><i class="fa-solid fa-trash"></i></button></div>
              </div>`).join('');
            const n = items.filter(r => r.equipo || r.marca || r.modelo || r.serial).length;
            document.getElementById('contador').textContent = `(${n} fila${n === 1 ? '' : 's'})`;
        }
        function agregarFila() { items.push(filaVacia()); renderItems(); guardarAuto(); }
        function eliminarFila(i) { items.splice(i, 1); if (!items.length) items.push(filaVacia()); renderItems(); guardarAuto(); }

        /* ---------- Importar desde una recepción ---------- */
        const txt = c => { const v = c.value; if (v == null) return ''; if (typeof v === 'object') return String(v.richText ? v.richText.map(t => t.text).join('') : (v.result ?? v.text ?? '')).trim(); return String(v).trim(); };
        const claveEq = r => [r.equipo, r.marca, r.modelo].map(s => s.trim().toUpperCase()).join('|');

        function agregarEquipos(lista) {
            if (items.length === 1 && !items[0].equipo && !items[0].marca && !items[0].modelo && !items[0].serial) items = [];
            const agrupar = document.getElementById('agrupar').checked;
            lista.forEach(e => {
                const ex = agrupar ? items.find(r => claveEq(r) === claveEq(e)) : null;
                if (ex) { ex.cant = (parseInt(ex.cant) || 0) + 1; ex.serial = [ex.serial, e.serial].filter(Boolean).join('\n'); }
                else items.push({ cant: 1, equipo: e.equipo, marca: e.marca, modelo: e.modelo, serial: e.serial, obs: '' });
            });
            renderItems(); guardarAuto();
        }
        function registrarRecepcion(nro, cliente) {
            const inp = document.getElementById('nroRecepcion');
            const actuales = inp.value.split('/').map(s => s.trim()).filter(Boolean);
            if (nro && !actuales.includes(nro)) inp.value = [...actuales, nro].join(' / ');
            if (cliente && !val('cliente')) document.getElementById('cliente').value = cliente;
        }
        const nombreEquipo = tipo => tipo === 'U' ? 'Detector Monogas' : 'Detector Multigas';
        function msg(t, ok = true) { const m = document.getElementById('msgImport'); m.textContent = t; m.className = 'text-xs mt-2 font-semibold ' + (ok ? 'text-emerald-700' : 'text-red-700'); }

        async function importarExcel(files) {
            let total = 0, recs = [];
            try {
                for (const f of files) {
                    const wb = new ExcelJS.Workbook();
                    await wb.xlsx.load(await f.arrayBuffer());
                    wb.worksheets.forEach(ws => {
                        const lista = [];
                        for (let i = 0; i < 7; i++) {
                            const b = 11 + i * 4;
                            const serial = txt(ws.getCell('B' + b)), marca = txt(ws.getCell('C' + b)), modelo = txt(ws.getCell('D' + b));
                            if (!serial && !marca && !modelo) continue;
                            lista.push({ equipo: nombreEquipo(txt(ws.getCell('E' + b)).toUpperCase()), marca, modelo, serial });
                        }
                        if (!lista.length) return;
                        const nro = txt(ws.getCell('C6'));
                        registrarRecepcion(nro, txt(ws.getCell('N6')));
                        if (nro && !recs.includes(nro)) recs.push(nro);
                        agregarEquipos(lista); total += lista.length;
                    });
                }
            } catch (e) { return msg('No se pudo leer el archivo: ' + e.message, false); }
            if (!total) return msg('No se encontraron ítems. Use el Excel exportado del formulario de recepción FT-01.', false);
            msg(`Se importaron ${total} equipo(s) de la recepción ${recs.join(', ') || '—'}. Complete los códigos de certificado en Observaciones.`);
        }

        function importarBorrador() {
            let b = null;
            try { b = JSON.parse(localStorage.getItem(CLAVE_RECEPCION)); } catch {}
            if (!b || !b.itemsData?.length) return msg('No hay un borrador de recepción guardado en este navegador. Use "Cargar Excel(s) de recepción".', false);
            registrarRecepcion((b.nroRecepcion || '').trim(), (b.cliente || '').trim());
            const lista = b.itemsData.filter(r => r.serial || r.marca || r.modelo)
                .map(r => ({ equipo: nombreEquipo(String(r.tipo).toUpperCase()), marca: r.marca || '', modelo: r.modelo || '', serial: r.serial || '' }));
            agregarEquipos(lista);
            msg(`Se importaron ${lista.length} equipo(s) del borrador de la recepción ${b.nroRecepcion || '—'}.`);
        }

        /* ---------- Firebase Realtime Database (API REST, sin SDK) ----------
           Mismo esquema que RO-SGL-7.4-FT-01: cada recepción vive en
           /recepciones/<NRO_EN_MAYÚSCULAS> y la búsqueda es por prefijo de la clave. */
        const FIREBASE_DB_URL = 'https://laboratorio-64b0f-default-rtdb.firebaseio.com';
        /* Cada formulario de recepción guarda en su propio nodo y con sus propios códigos de tipo. */
        const FUENTES = [
            { nodo: 'recepciones',            form: 'FT-01', etiqueta: 'Gases',     color: 'bg-amber-100 text-amber-800',
              equipo: t => nombreEquipo(t) },                                               // M = multigas, U = monogas
            { nodo: 'recepciones_presion',    form: 'FT-02', etiqueta: 'Presión',   color: 'bg-sky-100 text-sky-800',
              equipo: t => t === 'D' ? 'Manómetro Digital' : 'Manómetro Analógico' },       // A / D
            { nodo: 'recepciones_electricas', form: 'FT-03', etiqueta: 'Eléctricos', color: 'bg-violet-100 text-violet-800',
              equipo: t => ({ PA: 'Pinza Amperimétrica', MT: 'Multímetro', ME: 'Meghómetro', TE: 'Telurómetro' }[t] || 'Instrumento Eléctrico') }
        ];
        const cargadas = new Set();   // "nodo|clave" de las recepciones ya traídas a este formulario

        function claveRecepcion(nro) {
            return String(nro || '').trim().toUpperCase().replace(/[.$#\[\]\/\s]+/g, '_');
        }

        async function fbRequest(ruta, { params = '' } = {}) {
            let res;
            try { res = await fetch(`${FIREBASE_DB_URL}/${ruta}.json${params}`); }
            catch { throw new Error('Sin conexión con Firebase. Revise su internet.'); }
            if (!res.ok) {
                let m = '';
                try { m = (await res.json()).error || ''; } catch { /* sin cuerpo JSON */ }
                if (res.status === 401 || res.status === 403) throw new Error('Firebase rechazó el acceso a /' + ruta.split('/')[0] + ' (' + (m || res.status) + '). Revise las reglas de la base de datos.');
                throw new Error(m || ('Error HTTP ' + res.status));
            }
            return res.json();
        }

        let toastTimer = null;
        function avisar(mensaje, tipo = 'ok') {
            const t = document.getElementById('toast');
            t.textContent = mensaje;
            t.className = 'no-print fixed bottom-4 left-1/2 -translate-x-1/2 z-[60] px-4 py-2 rounded-lg shadow-lg text-xs font-semibold text-white max-w-[90vw] '
                        + (tipo === 'error' ? 'bg-red-600' : 'bg-emerald-600');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => t.classList.add('hidden'), tipo === 'error' ? 7000 : 3500);
        }

        function fechaTexto(iso) { const [a, m, d] = String(iso).split('-'); return (a && m && d) ? `${d}/${m}/${a}` : String(iso); }

        function abrirBuscador() {
            document.getElementById('modalBuscar').classList.remove('hidden');
            const inp = document.getElementById('buscarNro');
            inp.value = '';
            inp.focus();
            ejecutarBusqueda();
        }
        function cerrarBuscador() { document.getElementById('modalBuscar').classList.add('hidden'); }

        async function ejecutarBusqueda() {
            const cont = document.getElementById('resultadosBusqueda');
            const q = sinTildes(document.getElementById('buscarNro').value.trim());
            const qClave = claveRecepcion(q).toLowerCase();
            cont.innerHTML = '<p class="text-slate-500 p-2"><i class="fa-solid fa-spinner fa-spin"></i> Buscando…</p>';
            // Se traen las últimas LIMITE_BUSQUEDA (1000) recepciones de cada formulario y se filtra aquí:
            // así se puede buscar por número, cliente, equipo, serial, etc., no solo por el prefijo del número.
            const params = `?orderBy=${encodeURIComponent('"$key"')}&limitToLast=${LIMITE_BUSQUEDA}`;
            // Se consultan los tres nodos a la vez; si uno falla, se muestran los demás y se avisa del error.
            const resp = await Promise.allSettled(FUENTES.map(f => fbRequest(f.nodo, { params })));
            const todas = [], errores = [];
            const textoPlano = v => v == null ? '' : (typeof v === 'object' ? Object.values(v).map(textoPlano).join(' ') : String(v));
            resp.forEach((r, i) => {
                if (r.status === 'rejected') { errores.push(`${FUENTES[i].etiqueta} (${FUENTES[i].form}): ${r.reason.message}`); return; }
                Object.entries(r.value || {}).forEach(([clave, d]) => {
                    d = d || {};
                    if (q && !sinTildes(clave + ' ' + textoPlano(d)).includes(q) && !(qClave && clave.toLowerCase().includes(qClave))) return;
                    todas.push({ fuente: FUENTES[i], clave, d });
                });
            });
            // Las más recientes primero
            todas.sort((a, b) => String(b.d.guardadoEn || '').localeCompare(String(a.d.guardadoEn || '')) || b.clave.localeCompare(a.clave));
            const MOSTRAR = 30, filas = todas.slice(0, MOSTRAR);
            cont.innerHTML = '';
            if (!filas.length && !errores.length) cont.innerHTML = '<p class="text-slate-500 p-2">No se encontraron recepciones entre las últimas ' + LIMITE_BUSQUEDA + ' de cada formulario.</p>';
            filas.forEach(({ fuente, clave, d }) => {
                const nItems = Array.isArray(d.itemsData) ? d.itemsData.length : Object.keys(d.itemsData || {}).length;
                const b = document.createElement('button');
                b.type = 'button';
                b.className = 'w-full text-left p-2 mb-1 border border-slate-200 rounded hover:bg-blue-50 hover:border-blue-300 transition';
                const l1 = document.createElement('div');
                l1.className = 'flex items-center gap-2 font-mono font-bold text-slate-800';
                const num = document.createElement('span'); num.textContent = d.nroRecepcion || clave;
                const tag = document.createElement('span');
                tag.className = 'px-1.5 py-0.5 rounded text-[10px] font-semibold font-sans ' + fuente.color;
                tag.textContent = `${fuente.etiqueta} · ${fuente.form}`;
                l1.append(num, tag);
                const l2 = document.createElement('div');
                l2.className = 'text-slate-500';
                l2.textContent = [d.cliente || 'Sin cliente', d.fechaRecepcion ? fechaTexto(d.fechaRecepcion) : '', nItems + ' ítem(s)'].filter(Boolean).join('  ·  ');
                b.append(l1, l2);
                b.addEventListener('click', () => cargarRecepcion(fuente, clave));
                cont.appendChild(b);
            });
            if (todas.length > MOSTRAR) {
                const p = document.createElement('p'); p.className = 'text-slate-400 p-2';
                p.textContent = `Se muestran ${MOSTRAR} de ${todas.length}. Afine la búsqueda para ver otras.`;
                cont.appendChild(p);
            }
            errores.forEach(t => {
                const p = document.createElement('p');
                p.className = 'text-red-600 p-2';
                p.textContent = 'Error en la búsqueda · ' + t;
                cont.appendChild(p);
            });
        }

        async function cargarRecepcion(fuente, clave) {
            try {
                const d = await fbRequest(`${fuente.nodo}/${clave}`);
                if (!d) { avisar('La recepción ya no existe.', 'error'); return; }
                const nro = String(d.nroRecepcion || clave).trim();
                const id = fuente.nodo + '|' + clave;
                if (cargadas.has(id)) { avisar(`La recepción ${nro} (${fuente.etiqueta}) ya está cargada en este formulario.`, 'error'); return; }
                if (val('nroRecepcion').split('/').map(x => x.trim()).includes(nro) &&
                    !confirm(`El número ${nro} ya figura en este formulario.\n¿Agregar también los equipos de ${fuente.etiqueta} (${fuente.form})?`)) return;
                // Firebase puede devolver objetos en vez de arreglos: se normaliza.
                const crudo = Array.isArray(d.itemsData) ? d.itemsData : Object.values(d.itemsData || {});
                const lista = crudo.filter(r => r && (r.serial || r.marca || r.modelo)).map(r => ({
                    equipo: fuente.equipo(String(r.tipo || '').toUpperCase()),
                    marca: r.marca || '', modelo: r.modelo || '', serial: r.serial || ''
                }));
                if (!lista.length) { avisar(`La recepción ${nro} no tiene equipos registrados.`, 'error'); return; }
                cargadas.add(id);
                registrarRecepcion(nro, String(d.cliente || '').trim());
                agregarEquipos(lista);
                cerrarBuscador();
                msg(`Recepción ${nro} (${fuente.etiqueta}) cargada desde la base de datos: ${lista.length} equipo(s). Complete los códigos de certificado en Observaciones.`);
                avisar(`Recepción ${nro} cargada.`);
            } catch (e) {
                avisar('No se pudo cargar: ' + e.message, 'error');
            }
        }

        /* ---------- Utilidades de Excel ---------- */
        const val = id => (document.getElementById(id)?.value ?? '').trim();
        function celdaDestino(ws, ref) { const c = ws.getCell(ref); return (c.isMerged && c.master) ? c.master : c; }
        function escribir(ws, ref, valor) {
            const c = celdaDestino(ws, ref);
            if (c.value && typeof c.value === 'object' && 'formula' in c.value) return;
            c.value = (valor === '' || valor === undefined) ? null : valor;
        }

        function clonarHoja(wb, origen, nombre, nFilas) {
            const destino = wb.addWorksheet(nombre, {
                pageSetup:  JSON.parse(JSON.stringify(origen.pageSetup  || {})),
                properties: JSON.parse(JSON.stringify(origen.properties || {})),
                views:      JSON.parse(JSON.stringify(origen.views      || []))
            });

            const columnas = origen.columnCount;
            const delta = nFilas - FILAS_PLANTILLA;                 // cuánto se desplazan las filas posteriores a los ítems
            const ULT_ITEM_PLANTILLA = FILA_INI + FILAS_PLANTILLA - 1;
            const totalDestino = origen.rowCount + delta;
            const esItem = d => d >= FILA_INI && d < FILA_INI + nFilas;
            // Fila de la plantilla de la que se copia el formato: primera, intermedias y última de los ítems conservan sus bordes.
            const filaOrigen = d => {
                if (d < FILA_INI) return d;
                if (esItem(d)) return d === FILA_INI ? FILA_INI : (d === FILA_INI + nFilas - 1 ? ULT_ITEM_PLANTILLA : FILA_INI + 4);
                return d - delta;
            };

            // 1) Anchos de columna
            for (let c = 1; c <= columnas; c++) {
                const col = origen.getColumn(c);
                if (col.width)  destino.getColumn(c).width  = col.width;
                if (col.hidden) destino.getColumn(c).hidden = true;
            }
            aplicarAnchosFijos(destino);

            // 2) Combinaciones (antes que los estilos): las de los ítems se repiten en cada fila creada;
            //    las de debajo (observaciones, firmas) se desplazan.
            (origen.model.merges || []).forEach(m => {
                const x = /^([A-Z]+)(\d+):([A-Z]+)(\d+)$/.exec(m);
                if (!x) return;
                const r1 = +x[2], r2 = +x[4];
                try {
                    if (r2 < FILA_INI) destino.mergeCells(m);
                    else if (r1 > ULT_ITEM_PLANTILLA) destino.mergeCells(`${x[1]}${r1 + delta}:${x[3]}${r2 + delta}`);
                    else if (r1 === FILA_INI && r2 === FILA_INI)
                        for (let d = FILA_INI; d < FILA_INI + nFilas; d++) destino.mergeCells(`${x[1]}${d}:${x[3]}${d}`);
                } catch (e) {}
            });

            // 3) Alturas, estilos y textos fijos de la plantilla (los ítems de ejemplo no se copian)
            for (let d = 1; d <= totalDestino; d++) {
                const fo = origen.getRow(filaOrigen(d)), fd = destino.getRow(d);
                if (esItem(d)) fd.height = 26.25;
                else if (fo.height) fd.height = fo.height;
                for (let c = 1; c <= columnas; c++) {
                    const co = fo.getCell(c), cd = fd.getCell(c);
                    if (co.style) cd.style = JSON.parse(JSON.stringify(co.style));
                    if (esItem(d)) continue;
                    if (cd.isMerged && cd.master !== cd) continue;   // el valor vive en la maestra
                    const v = co.value;
                    if (v && typeof v === 'object' && v.formula) cd.value = { formula: v.formula };
                    else if (v !== null && v !== undefined)       cd.value = v;
                }
            }
            if (destino.pageSetup.printArea) destino.pageSetup.printArea = `A2:U${38 + delta}`;

            // 4) Imágenes embebidas (el logo), con la misma posición y tamaño.
            (origen.getImages() || []).forEach(img => {
                try {
                    const media   = wb.getImage(img.imageId);
                    const nuevoId = wb.addImage({ buffer: media.buffer, extension: media.extension });
                    destino.addImage(nuevoId, {
                        tl: { nativeCol: img.range.tl.nativeCol, nativeColOff: img.range.tl.nativeColOff || 0, nativeRow: img.range.tl.nativeRow, nativeRowOff: img.range.tl.nativeRowOff || 0 },
                        br: { nativeCol: img.range.br.nativeCol, nativeColOff: img.range.br.nativeColOff || 0, nativeRow: img.range.br.nativeRow, nativeRowOff: img.range.br.nativeRowOff || 0 },
                        editAs: img.range.editAs
                    });
                } catch (e) { /* si la plantilla no trae imagen, se omite sin romper la copia */ }
            });

            return destino;
        }

        function aplicarAnchosFijos(ws) {
            ws.properties = ws.properties || {};
            ws.properties.defaultColWidth = ANCHO_POR_DEFECTO;
        }

        /** Decodifica el base64 incrustado a un ArrayBuffer, tal como lo
            necesita ExcelJS. No depende de Buffer de Node (no existe en el
            navegador), solo de atob(), disponible en cualquier navegador. */
        function base64ABuffer(base64) {
            const binario = atob(base64);
            const bytes = new Uint8Array(binario.length);
            for (let i = 0; i < binario.length; i++) bytes[i] = binario.charCodeAt(i);
            return bytes.buffer;
        }

        async function obtenerPlantilla() {
            if (plantillaBuffer) return plantillaBuffer;
            try {
                plantillaBuffer = base64ABuffer(PLANTILLA_BASE64);
                return plantillaBuffer;
            } catch (e) {
                // Solo debería llegar aquí si el base64 incrustado se corrompió
                // al editar el archivo a mano; se ofrece elegir el .xlsx a mano.
                return await pedirPlantillaAlUsuario();
            }
        }

        function pedirPlantillaAlUsuario() {
            return new Promise((resolve, reject) => {
                const input = document.getElementById('inputPlantilla');
                const onChange = async () => {
                    input.removeEventListener('change', onChange);
                    const f = input.files[0];
                    input.value = '';
                    if (!f) return reject(new Error('No se seleccionó ningún archivo .xlsx'));
                    plantillaBuffer = await f.arrayBuffer();
                    resolve(plantillaBuffer);
                };
                input.addEventListener('change', onChange);
                input.click();
            });
        }

        /** Botón "Cargar Plantilla": permite probar otra plantilla distinta a
            la incrustada, sin tocar el código, solo para la sesión actual
            (se pierde al recargar la página). */
        async function seleccionarPlantilla() {
            plantillaBuffer = null;
            try {
                await pedirPlantillaAlUsuario();
                alert('Plantilla cargada para esta sesión. Ya puede exportar.');
            } catch (e) { /* cancelado por el usuario */ }
        }


        /* =====================================================================
           EXPORTAR A PDF CON EL FORMATO EXACTO DE LA PLANTILLA
           ---------------------------------------------------------------------
           El botón "Imprimir / PDF" ya no imprime el formulario web (que tiene
           su propio diseño en Tailwind): genera un PDF a partir del MISMO libro
           de Excel que produce "Exportar Excel" (armarLibroDesdeFormulario),
           reconstruyendo cada hoja como una tabla HTML con los bordes, colores,
           fuentes y celdas combinadas leídos directamente de la plantilla, y
           la rasteriza con html2canvas + jsPDF. El PDF resultante reproduce la
           plantilla tal cual está, sin pasar por el diseño de la página web.
           (ACTUALIZADO: ahora el PDF es vectorial: se dibuja con jsPDF directamente
           desde el libro de Excel, con las mismas medidas que usa Excel al imprimir.)
           ===================================================================== */

        /* Paleta del tema "Office" por defecto. Solo se usa cuando una celda
           referencia un color por número de tema (fill.fgColor.theme, etc.)
           en lugar de un color directo (argb). Es la paleta estándar que trae
           cualquier libro nuevo de Excel salvo que el autor haya cambiado el
           tema del documento. */
        const TEMA_OFFICE = ['FFFFFF', '000000', 'E7E6E6', '44546A',
                              '4472C4', 'ED7D31', 'A5A5A5', 'FFC000', '5B9BD5', '70AD47'];

        function aplicarTinte(hex, tint) {
            const c = [0, 2, 4].map(i => parseInt(hex.substr(i, 2), 16));
            const ajustado = c.map(v => tint < 0 ? v * (1 + tint) : v + (255 - v) * tint);
            return '#' + ajustado.map(v => Math.max(0, Math.min(255, Math.round(v)))
                                              .toString(16).padStart(2, '0')).join('');
        }

        /** Convierte un color de ExcelJS (argb directo, tema+tinte, o índice
            de la paleta heredada) a un color CSS. `paraRelleno` decide qué
            devolver cuando el color es "automático" (índice 64): nada para
            relleno (transparente) y negro para texto o bordes. */
        function colorCss(colorObj, paraRelleno = false) {
            if (!colorObj) return paraRelleno ? null : '#000000';
            if (colorObj.argb) return '#' + colorObj.argb.slice(2);
            if (colorObj.theme !== undefined) {
                const base = TEMA_OFFICE[colorObj.theme] || '000000';
                return aplicarTinte(base, colorObj.tint || 0);
            }
            if (colorObj.indexed !== undefined) {

                if (!m) return;
                const o = { c1: letrasANum(m[1]), r1: +m[2], c2: letrasANum(m[3]), r2: +m[4] };
                ancla[o.r1 + ':' + o.c1] = o;

            for (let r = rg.r1; r <= rg.r2; r++) for (let c = rg.c1; c <= rg.c2; c++) {
                const k = r + ':' + c, mo = cubierta[k] || ancla[k] || null, bd = celdaDe(r, c).border || {};
                const x1 = colX[c], x2 = colX[c + 1], y1 = rowY[r], y2 = rowY[r + 1];
                if (!mo || r === mo.r1) agregar(bd.top, x1, y1, x2, y1);

        /** Arma el PDF completo (una página por hoja del libro de Excel). */
        async function construirPDF() {

            pdf.setProperties({ title: nombre.replace(/\.pdf$/i, ''), subject: 'RO-SGL-7.4-FT-09 Registro de Salida de Items', creator: 'RO-SGL-7.4-FT-09' });
            for (let i = 0; i < libro.hojas.length; i++) {
                if (i > 0) pdf.addPage('a4', 'portrait');
                await dibujarHoja(pdf, libro.hojas[i], libro.wb);

        /* ---------- Exportación sobre la plantilla FT-09 ---------- */
        function alturaFila(r) {
            const l = (t, w) => String(t || '').split('\n').reduce((a, s) => a + Math.max(1, Math.ceil(s.length / w)), 0);
            return Math.max(26.25, Math.max(l(r.serial, 16), l(r.obs, 17), l(r.modelo, 14), l(r.equipo, 13), l(r.marca, 14)) * 12.5 + 4);
        }
        function paginar(filas) {
            const pags = []; let cur = [], h = 0;
            filas.forEach(r => {
                const a = alturaFila(r);
                if (cur.length && (cur.length >= FILA_MAX || h + a > PRESUPUESTO_ALTO)) { pags.push(cur); cur = []; h = 0; }
                cur.push(r); h += a;
            });
            pags.push(cur);
            return pags;
        }
        function llenarHoja(ws, lote, ultima, nFilas) {
            const iso = val('fecha') || hoyISO();
            escribir(ws, 'F8', val('nroSalida'));
            escribir(ws, 'N8', +iso.slice(8, 10)); escribir(ws, 'R8', +iso.slice(5, 7)); escribir(ws, 'T8', +iso.slice(0, 4));
            forzar(ws, 'T18', null);   // la plantilla trae un "2019" suelto en esta celda
            escribir(ws, 'D12', val('nroRecepcion'));
            escribir(ws, 'D13', val('cliente'));
            const resp = val('responsable') || val('cliente');
            if (val('responsable')) forzar(ws, 'D15', val('responsable'));
            else celdaDestino(ws, 'D15').value = { formula: 'D13', result: val('cliente') };   // conserva la fórmula de la plantilla con su resultado (lo usa el PDF)
            for (let i = 0; i < nFilas; i++) {
                const r = lote[i], n = FILA_INI + i;
                escribir(ws, 'A' + n, r && r.cant !== '' ? Number(r.cant) : null);
                escribir(ws, 'B' + n, r?.equipo); escribir(ws, 'D' + n, r?.marca); escribir(ws, 'G' + n, r?.modelo);
                escribir(ws, 'K' + n, r?.serial); escribir(ws, 'P' + n, r?.obs);
                ws.getRow(n).height = r ? alturaFila(r) : 26.25;
            }
            // Observaciones y firmas solo en la última página
            const fObs = FILA_INI + nFilas, fFirmas = fObs + 3;      // 33 y 36 cuando hay 13 filas
            escribir(ws, 'D' + fObs, ultima ? val('observaciones') : '');
            escribir(ws, 'A' + fFirmas, ultima ? val('elaborado') : '');
            escribir(ws, 'F' + fFirmas, ultima ? val('aprobado') : '');
            const celdaRecibido = 'L' + fFirmas;
            if (!ultima) forzar(ws, celdaRecibido, null); else if (val('recibido')) forzar(ws, celdaRecibido, val('recibido')); else celdaDestino(ws, celdaRecibido).value = { formula: 'D15', result: resp };
        }
        async function armarLibro() {
            const wb = new ExcelJS.Workbook();
            await wb.xlsx.load(await obtenerPlantilla());
            const hoja1 = wb.getWorksheet(NOMBRE_HOJA) || wb.worksheets[0];
            if (!hoja1) throw new Error('La plantilla no contiene hojas.');
            aplicarAnchosFijos(hoja1);
            hoja1.pageSetup.fitToPage = true; hoja1.pageSetup.fitToWidth = 1; hoja1.pageSetup.fitToHeight = 1;
            const filas = items.filter(r => r.equipo || r.marca || r.modelo || r.serial || r.obs);
            const pags = paginar(filas);
            // Cada página se crea con las filas que necesita (entre FILAS_MIN y FILA_MAX) a partir de la plantilla.
            const nFilasPag = pags.map(lote => Math.min(FILA_MAX, Math.max(FILAS_MIN, lote.length)));
            const hojas = pags.map((lote, p) => clonarHoja(wb, hoja1, `__pagina${p + 1}`, nFilasPag[p]));
            wb.removeWorksheet(hoja1.id);                              // la hoja original de la plantilla ya no se usa
            hojas.forEach((h, p) => { h.name = pags.length > 1 ? `Salida ${p + 1} de ${pags.length}` : NOMBRE_HOJA; });
            pags.forEach((lote, p) => llenarHoja(hojas[p], lote, p === pags.length - 1, nFilasPag[p]));
            wb.calcProperties = wb.calcProperties || {}; wb.calcProperties.fullCalcOnLoad = true;
            return { wb, hojas };
        }
        /** Nombre del archivo exportado: "No <salida> <Cliente/Destino> <No. Recepción>" (ej. No 540 EMPRESA SA 1401). */
        /** De "LB-2026-1401" deja solo el correlativo final "1401". Varias recepciones (separadas por /) se unen con "-". */
        function correlativos(txt) {
            return String(txt || '').split('/').map(x => x.trim()).filter(Boolean)
                .map(x => { const m = x.match(/(\d+)\D*$/); return m ? m[1] : x.replace(/[\\:*?"<>|]+/g, '-'); }).join('-');
        }
        function nombreArchivo(ext) {
            const nro = String(numSalida() || val('nroSalida') || 'Salida');
            const limpiar = t => String(t || '').replace(/[\\/:*?"<>|\x00-\x1f]+/g, '-').replace(/\s+/g, ' ').trim();
            const partes = ['No ' + nro, limpiar(val('cliente')), correlativos(val('nroRecepcion'))].filter(Boolean);
            return partes.join(' ').slice(0, 180) + '.' + ext;
        }
        async function exportarExcel() {
            let libro;
            try { libro = await armarLibro(); } catch (e) { return alert('No se pudo generar el Excel: ' + e.message); }
            const out = await libro.wb.xlsx.writeBuffer();
            const url = URL.createObjectURL(new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
            const a = document.createElement('a'); a.href = url; a.download = nombreArchivo('xlsx');
            document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
        }
        let generandoPDF = false;
        /** Ejecuta una acción de PDF mostrando "Generando..." en el botón y evitando dobles clics. */
        async function tareaPDF(selector, accion) {
            if (generandoPDF) return;
            generandoPDF = true;
            const btn = document.querySelector(selector);
            const html = btn ? btn.innerHTML : '';
            if (btn) { btn.disabled = true; btn.classList.add('opacity-60', 'cursor-wait'); btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Generando...'; }
            try { await accion(); }
            catch (e) { alert('No se pudo generar el PDF: ' + (e && e.message ? e.message : e)); }
            finally {
                generandoPDF = false;
                if (btn) { btn.disabled = false; btn.classList.remove('opacity-60', 'cursor-wait'); btn.innerHTML = html; }
            }
        }
        async function exportarPDF() {
            return tareaPDF('button[onclick="exportarPDF()"]', async () => {
                const { pdf, nombre } = await construirPDF();
                pdf.save(nombre);
            });
        }
        /** Abre el cuadro de impresión del navegador con el mismo PDF (si el navegador lo bloquea, lo abre en otra pestaña). */
        async function imprimirPDF() {
            return tareaPDF('button[onclick="imprimirPDF()"]', async () => {
                const { pdf } = await construirPDF();
                const url = URL.createObjectURL(pdf.output('blob'));
                const f = document.createElement('iframe');
                f.style.cssText = 'position:fixed;right:0;bottom:0;width:1px;height:1px;border:0;opacity:0';
                f.onload = () => { try { f.contentWindow.focus(); f.contentWindow.print(); } catch (e) { window.open(url, '_blank'); } };
                f.src = url; document.body.appendChild(f);
                setTimeout(() => { URL.revokeObjectURL(url); f.remove(); }, 5 * 60 * 1000);
            });
        }

</script>
